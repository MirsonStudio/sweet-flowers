<!doctype html>
<html lang="he" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta property="og:type" content="website"><meta property="og:url" content="https://sweetfloweryuliya.netlify.app/"><meta property="og:image" content="https://sweetfloweryuliya.netlify.app/og.jpg"><meta property="og:image:width" content="1200"><meta property="og:image:height" content="630"><meta name="twitter:card" content="summary_large_image"><meta property="og:title" content="Sweet Flowers · פרחים שאפשר לאכול"><meta property="og:description" content="זרים וקופסאות של פרחי זפיר בעבודת יד מאת יוליה. הזמנה בוואטסאפ."><meta name="description" content="זרים וקופסאות של פרחי זפיר בעבודת יד מאת יוליה. הזמנה בוואטסאפ."><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Sweet Flowers Yuliya</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&family=Comfortaa:wght@600;700&family=Marck+Script&family=Rubik:wght@400;500;600&display=swap">
<style>
/* Layout: 3D hat-box bouquet hero with soft bubbles, scalloped pastel bands, flower ornaments drifting with scroll,
   a sticky horizontal 8-step story, round "bonbon" product cards, contact bubble. */
:root{
  color-scheme:light;
  --cream:#fffbfa;
  --petal:#fbe1e7;
  --petal-2:#fef3f5;
  --lilac:#f5effb;
  --berry:#9a2c50;
  --berry-ink:#5e1a30;
  --leaf:#5f8159;
  --ink:#3a2027;
  --muted:#7f6068;
  --line:#f3dbe0;
  --card:#ffffff;
  --rose-1:#c2466c; --rose-2:#f4a9bb; --rose-3:#fbe3c9; --rose-4:#b9a1dc; --leaf-c:#86a77e;
  --shadow:0 22px 50px -26px rgba(154,44,80,.5);
  --bub-hi:rgba(255,255,255,.95);--bub-mid:rgba(255,255,255,.35);
  --display-he:"Fredoka","Varela Round",system-ui,sans-serif;
  --display-ru:"Comfortaa","Trebuchet MS",system-ui,sans-serif;
  --script:"Marck Script","Brush Script MT",cursive;
  --body:"Rubik",system-ui,"Segoe UI",Arial,sans-serif;
  --display:var(--display-he);
}
:root[data-theme="dark"]{
  --cream:#1d1116;--petal:#3d1e2b;--petal-2:#2a151e;--lilac:#2a2034;--berry:#f39cb4;--berry-ink:#ffd3de;
  --leaf:#a7c2a1;--ink:#f8e7ea;--muted:#caa8b1;--line:#4c2b38;--card:#27141c;
  --rose-1:#e16f92;--rose-2:#a8556d;--rose-3:#7e6550;--rose-4:#7b65a3;--leaf-c:#6f8c68;
  --shadow:0 22px 50px -26px rgba(0,0,0,.75);--bub-hi:rgba(255,214,226,.45);--bub-mid:rgba(243,156,180,.12);color-scheme:dark}
html:lang(ru){--display:var(--display-ru)}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--cream);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.65;overflow-x:clip}
a{color:inherit}
h1,h2,h3{font-family:var(--display);font-weight:700;line-height:1.1;text-wrap:balance;margin:0}
.wrap{position:relative;z-index:1;max-width:1140px;margin-inline:auto;padding-inline:20px}
:focus-visible{outline:3px solid var(--berry);outline-offset:3px;border-radius:12px}

/* falling petals layer */
#petals{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:3}

/* header */
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--cream) 93%,transparent);border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:16px;padding-block:10px}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;font-family:var(--script);font-size:1.7rem;color:var(--berry);white-space:nowrap;line-height:1}
.brand svg{width:34px;height:34px;flex:none}
nav{display:flex;gap:6px;margin-inline-start:auto;font-size:.95rem}
nav a{text-decoration:none;color:var(--muted);padding:6px 12px;border-radius:99px}
nav a:hover{color:var(--berry);background:var(--petal-2)}
.bar .menu-btn{flex:none}
@media (max-width:640px){.bar{gap:8px}.brand{font-size:1.35rem;gap:6px;min-width:0}.brand svg{width:26px;height:26px}.lang button{padding:5px 10px}}
@media (max-width:360px){.brand{font-size:1.1rem}}
.lang{display:flex;border:1px solid var(--line);border-radius:99px;padding:4px;gap:2px;background:var(--card);box-shadow:var(--shadow)}
.lang button{all:unset;cursor:pointer;padding:5px 13px;border-radius:99px;font-size:.88rem;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--berry);color:var(--cream)}
@media (max-width:820px){nav{display:none}.lang{margin-inline-start:auto}}

/* light / dark switch */
.theme-btn{all:unset;cursor:pointer;flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--card);color:var(--berry);box-shadow:0 0 0 1px var(--line),var(--shadow);transition:transform .3s cubic-bezier(.3,1.6,.5,1),background .3s,color .3s}
.theme-btn:hover{transform:rotate(-15deg) scale(1.06)}
.theme-btn:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.theme-btn svg{width:19px;height:19px;grid-area:1/1;transition:transform .45s cubic-bezier(.3,1.4,.5,1),opacity .3s}
.theme-btn .t-sun{opacity:0;transform:rotate(-90deg) scale(.4)}
:root[data-theme="dark"] .theme-btn .t-moon{opacity:0;transform:rotate(90deg) scale(.4)}
:root[data-theme="dark"] .theme-btn .t-sun{opacity:1;transform:none}
html.theme-anim,html.theme-anim *{transition:background-color .45s ease,color .45s ease,border-color .45s ease!important}
@media (max-width:640px){.theme-btn{width:34px;height:34px}.theme-btn svg{width:17px;height:17px}}
@media (max-width:440px){
  .bar{gap:6px}
  .brand{font-size:1.12rem;gap:5px}.brand svg{width:22px;height:22px}
  .lang{padding:3px}.lang button{padding:4px 9px;font-size:.82rem}
  .menu-btn{padding:9px 10px}
}

/* site menu */
.menu-btn{all:unset;cursor:pointer;display:inline-flex;align-items:center;gap:8px;padding:8px 14px;border-radius:99px;background:var(--berry);color:var(--cream);font-weight:600;font-size:.92rem;box-shadow:var(--shadow);transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.menu-btn:hover{transform:translateY(-2px)}
.menu-btn:focus-visible{outline:3px solid var(--berry);outline-offset:3px}
.mb-ico{display:grid;gap:3px;width:16px}
.mb-ico i{display:block;height:2px;border-radius:2px;background:currentColor;transition:transform .3s,opacity .2s}
.menu-btn[aria-expanded="true"] .mb-ico i:nth-child(1){transform:translateY(5px) rotate(45deg)}
.menu-btn[aria-expanded="true"] .mb-ico i:nth-child(2){opacity:0}
.menu-btn[aria-expanded="true"] .mb-ico i:nth-child(3){transform:translateY(-5px) rotate(-45deg)}
.site-menu{position:absolute;left:0;right:0;top:100%;background:var(--cream);border-bottom:1px solid var(--line);box-shadow:0 30px 50px -30px rgba(94,26,48,.45);max-height:calc(100vh - 70px);overflow:auto;overscroll-behavior:contain;opacity:0;transform:translateY(-10px);transition:opacity .25s,transform .3s cubic-bezier(.2,.9,.2,1)}
.site-menu.open{opacity:1;transform:none}
.sm-in{display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:18px 40px;padding-block:22px 26px}
.sm-col{display:flex;flex-direction:column;gap:6px;min-width:0}
.sm-h{font-family:var(--script);font-size:1.5rem;color:var(--berry);line-height:1;margin-bottom:4px}
.site-menu a{text-decoration:none;display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:18px;font-weight:600;transition:background .2s}
.site-menu a:hover,.site-menu a:focus-visible{background:var(--petal-2);outline:none}
.site-menu a .n{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;background:var(--petal);color:var(--berry-ink);font-size:.8rem;flex:none}
.site-menu a.sm-big{flex-direction:column;align-items:flex-start;gap:0;background:var(--card);box-shadow:0 0 0 1.5px var(--line)}
.site-menu a.sm-big b{font-family:var(--display);font-size:1.15rem}
.site-menu a.sm-big small{color:var(--muted);font-weight:400}
.sm-cats{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.sm-cats button{all:unset;cursor:pointer;padding:7px 14px;border-radius:99px;background:var(--petal-2);color:var(--berry);font-weight:600;font-size:.9rem}
.sm-cats button:hover,.sm-cats button:focus-visible{background:var(--berry);color:var(--cream)}
.site-menu a.sm-wa{grid-column:1/-1;justify-self:start;color:var(--cream);padding:12px 22px}
.site-menu a.sm-wa:hover{background:var(--berry)}
section,#videos,#all{scroll-margin-top:84px}
@media (max-width:640px){.sm-in{grid-template-columns:1fr}.site-menu a.sm-wa{justify-self:stretch;justify-content:center}.mb-txt{display:none}.menu-btn{padding:10px 12px}}
@media (prefers-reduced-motion: reduce){.site-menu,.mb-ico i{transition:none}}

/* hero */
.hero{position:relative;overflow:clip;background:
  radial-gradient(60% 70% at 25% 40%,var(--petal) 0%,transparent 70%),
  radial-gradient(55% 60% at 80% 70%,var(--lilac) 0%,transparent 70%),
  var(--petal-2)}
.hero-art{position:relative;z-index:1;justify-self:center;width:min(100%,470px);aspect-ratio:826/1100;will-change:transform;transform-style:preserve-3d}
.hero-art .halo{position:absolute;inset:6% -8% 14%;border-radius:50%;background:radial-gradient(circle,var(--bub-hi) 0%,color-mix(in srgb,var(--petal) 75%,transparent) 42%,transparent 70%)}
.hero-art .floor{position:absolute;left:24%;width:58%;bottom:1%;height:7%;border-radius:50%;background:radial-gradient(closest-side,rgba(94,26,48,.38),transparent)}
.hero-art img,.hero-art canvas{position:absolute;inset:0;width:100%;height:100%}
.hero-art img{object-fit:contain;filter:drop-shadow(0 24px 28px rgba(94,26,48,.28))}
.hero-art canvas{filter:drop-shadow(0 24px 28px rgba(94,26,48,.28));opacity:0;transition:opacity .4s}
.hero-art.gl canvas{opacity:1}
.hero-art.gl img{visibility:hidden}
.bubble{position:absolute;border-radius:50%;z-index:0;pointer-events:none;
  background:radial-gradient(circle at 32% 30%,var(--bub-hi) 0 8%,var(--bub-mid) 22%,color-mix(in srgb,var(--petal) 60%,transparent) 60%,transparent 72%);
  animation:float 9s ease-in-out infinite;will-change:transform}
@keyframes float{50%{transform:translate3d(0,-22px,0)}}
.hero .wrap{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:24px;padding-block:48px 90px;align-items:center;z-index:2}
.hero-copy{max-width:33rem}
.eyebrow{display:inline-flex;gap:8px;align-items:center;font-size:.85rem;font-weight:600;color:var(--berry);background:var(--card);border:1px solid var(--line);padding:6px 14px;border-radius:99px;margin-bottom:20px;box-shadow:var(--shadow)}
.hero h1{font-size:clamp(2.8rem,7vw,5.2rem);color:var(--berry-ink)}
.hero h1 .script{display:block;font-family:var(--script);font-weight:400;color:var(--berry);font-size:.8em;margin-top:.1em}
.hero p{font-size:1.12rem;color:var(--muted);margin:20px 0 30px;max-width:30rem}
.ctas{display:flex;flex-wrap:wrap;gap:12px}
.btn{position:relative;display:inline-flex;align-items:center;gap:10px;padding:15px 24px;border-radius:99px;font-weight:600;text-decoration:none;border:0;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.btn svg{width:20px;height:20px}
.btn.primary{background:linear-gradient(180deg,color-mix(in srgb,var(--berry) 80%,#fff),var(--berry));color:var(--cream);box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.35)}
.btn.ghost{color:var(--berry);background:var(--card);box-shadow:inset 0 0 0 2px var(--line)}
.btn:hover{transform:translateY(-3px) scale(1.03)}
.badge{margin-top:26px;display:inline-flex;gap:10px;align-items:center;font-size:.95rem;background:var(--card);border:2px dashed var(--rose-2);padding:9px 16px;border-radius:20px}
@media (max-width:820px){.hero .wrap{grid-template-columns:1fr;padding-block:20px 60px}.hero-art{order:-1;width:min(78vw,340px)}}

/* scallops */
.scallop{height:26px;margin-top:-26px;position:relative;z-index:2;background:radial-gradient(circle at 50% 100%,var(--c) 66%,transparent 67%) 0 0/44px 52px repeat-x}

section{position:relative;padding-block:100px;overflow-x:clip}
.kicker{display:inline-block;font-family:var(--script);font-size:1.7rem;color:var(--berry);line-height:1}
.sec-title{font-size:clamp(2.1rem,5vw,3.3rem);color:var(--berry-ink);margin:8px 0 16px}
.lead{color:var(--muted);max-width:40rem;font-size:1.08rem}

/* flower ornaments */
.orn{position:absolute;z-index:0;pointer-events:none;width:var(--s,120px);height:var(--s,120px);will-change:transform}
.orn svg{width:100%;height:100%;transform:rotate(var(--r,0deg));filter:drop-shadow(0 10px 14px rgba(154,44,80,.18))}

/* about */
.about{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,330px);gap:56px;align-items:center}
.about .ingredients{margin-top:34px}
.ad-phone{position:relative;justify-self:center;width:100%;max-width:330px;aspect-ratio:9/16;border-radius:42px;overflow:hidden;background:var(--berry-ink);box-shadow:0 0 0 8px var(--card),0 0 0 9px var(--line),0 40px 70px -30px rgba(94,26,48,.7);transform:rotate(2deg);transition:transform .5s cubic-bezier(.3,1.5,.5,1)}
.ad-phone:hover{transform:rotate(0) translateY(-6px)}
.ad-phone video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ad-sound{all:unset;cursor:pointer;position:absolute;z-index:2;bottom:14px;inset-inline-start:14px;display:inline-flex;align-items:center;gap:7px;white-space:nowrap;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.9);color:var(--berry);font-weight:700;font-size:.9rem;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .25s}
.ad-sound:hover{transform:scale(1.05)}
.ad-sound:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ad-sound svg{width:18px;height:18px}
.ad-replay{all:unset;cursor:pointer;position:absolute;z-index:2;bottom:14px;inset-inline-end:14px;display:inline-flex;align-items:center;gap:6px;white-space:nowrap;padding:8px 13px;border-radius:99px;background:rgba(255,255,255,.9);color:#9a2c50;font-weight:700;font-size:.85rem;box-shadow:0 8px 20px rgba(0,0,0,.25);transition:transform .25s}
.ad-replay:hover{transform:scale(1.06)}
.ad-replay:active svg{transform:rotate(-200deg)}
.ad-replay svg{width:17px;height:17px;transition:transform .4s}
.ad-replay:focus-visible{outline:3px solid #fff;outline-offset:3px}
.ad-sound .s-on{display:none}
.ad-sound[aria-pressed="true"] .s-on{display:block}
.ad-sound[aria-pressed="true"] .s-off{display:none}
:root[data-theme="dark"] .ad-sound{background:rgba(255,255,255,.92);color:#9a2c50}
.ingredients{position:relative;background:var(--card);border-radius:44px;padding:34px;box-shadow:var(--shadow)}
.ingredients::before{content:"";position:absolute;inset:-10px;border-radius:52px;border:2px dashed var(--line);pointer-events:none}
.ingredients h3{font-size:1.5rem;color:var(--berry);margin-bottom:14px}
.ingredients ul{list-style:none;margin:0;padding:0;display:grid;gap:8px}
.ingredients li{display:flex;align-items:center;gap:12px;padding:10px 14px;border-radius:99px;background:var(--petal-2)}
.dot{width:16px;height:16px;border-radius:50%;flex:none;background:var(--c);box-shadow:inset -2px -2px 0 rgba(0,0,0,.08),inset 2px 2px 0 rgba(255,255,255,.6)}
.facts{display:flex;flex-wrap:wrap;gap:10px;margin-top:26px}
.facts span{display:inline-flex;align-items:center;gap:8px;padding:9px 16px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-size:.95rem;font-weight:500}
.facts span::before{content:"";width:10px;height:10px;border-radius:50%;background:var(--rose-1)}
@media (max-width:860px){
  /* phone: title and text on top, video beside the 3 facts, then a compact ingredients card */
  .about{grid-template-columns:minmax(0,.85fr) minmax(0,1fr);grid-template-areas:"k k" "t t" "l l" "v f" "i i";gap:12px 16px;align-items:start}
  .about>div:first-child{display:contents}
  .about .kicker{grid-area:k}
  .about .sec-title{grid-area:t;margin:0}
  .about .lead{grid-area:l;font-size:1rem;margin:0 0 8px}
  .about .ad-phone{grid-area:v;max-width:none;transform:none;border-radius:24px;box-shadow:0 0 0 5px var(--card),0 0 0 6px var(--line),0 24px 40px -22px rgba(94,26,48,.7)}
  .about .facts{grid-area:f;flex-direction:column;align-items:stretch;align-self:center;gap:10px;margin:0}
  .about .facts span{padding:10px 14px;font-size:.92rem;line-height:1.3}
  .about .ingredients{grid-area:i;margin-top:14px;padding:20px 18px;border-radius:30px}
  .about .ingredients::before{inset:-7px;border-radius:36px}
  .about .ingredients h3{font-size:1.25rem;margin-bottom:10px}
  .about .ingredients ul{grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .about .ingredients li{padding:8px 11px;font-size:.92rem;gap:9px;line-height:1.3}
  .about .ingredients .dot{width:13px;height:13px}
  .ad-sound{bottom:10px;inset-inline-start:10px;padding:8px}
  .ad-sound span,.ad-replay span{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
  .ad-replay{bottom:10px;inset-inline-end:10px;padding:8px}
}

/* steps story */
.steps{padding-block:0;background:var(--petal-2)}
.steps-head{padding-top:80px}
.journey{position:relative;padding-block:30px 70px}
.trail{position:absolute;left:0;top:0;overflow:visible;pointer-events:none;z-index:0}
.trail path{fill:none;stroke-linecap:round;stroke-linejoin:round}
.trail-bg{stroke:var(--line);stroke-width:9;stroke-dasharray:1 20}
.trail-fg{stroke:var(--rose-2);stroke-width:18}
.trail-hi{stroke:var(--card);stroke-width:5;opacity:.7}
.rider{position:absolute;left:0;top:0;width:46px;height:46px;margin:-23px 0 0 -23px;z-index:2;pointer-events:none;will-change:transform}
.rider svg{width:100%;height:100%;filter:drop-shadow(0 6px 8px rgba(154,44,80,.35))}
.jend{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--script);font-size:1.9rem;color:var(--berry);line-height:1}
.jend svg{width:150px;height:112px;overflow:visible}
.jsteps{list-style:none;margin:0;padding:50px 0;position:relative;z-index:1;display:grid;gap:clamp(48px,9vh,96px)}
.jstep{display:grid;grid-template-columns:minmax(0,1fr) 128px minmax(0,1fr);align-items:center}
.jnode{grid-column:2;grid-row:1;justify-self:center;position:relative;width:92px;height:92px;border-radius:50%;background:var(--card);box-shadow:var(--shadow);display:grid;place-items:center}
.jnode .bloom{position:absolute;inset:-16px;width:calc(100% + 32px);height:calc(100% + 32px);opacity:0;transform:scale(.25) rotate(-120deg);transition:transform .8s cubic-bezier(.3,1.55,.5,1),opacity .35s}
.jnode .n{position:relative;font-family:var(--script);font-size:2.4rem;line-height:1;color:var(--berry);transition:color .4s}
.jstep.on .bloom{opacity:1;transform:none}
.jstep.on .jnode .n{color:#fff;text-shadow:0 1px 4px rgba(70,15,35,.75)}
:root{--sx:1}
:root[dir="rtl"]{--sx:-1}
.jcard{grid-row:1;max-width:430px;width:100%;background:var(--card);border-radius:38px;padding:24px 26px 26px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:10px;opacity:.5;transition:transform .7s cubic-bezier(.2,.8,.2,1),opacity .6s}
.jstep:nth-child(odd) .jcard{grid-column:1;justify-self:end;transform:translateX(calc(var(--sx) * -36px))}
.jstep:nth-child(even) .jcard{grid-column:3;justify-self:start;transform:translateX(calc(var(--sx) * 36px))}
.jstep.on .jcard{opacity:1;transform:none}
.jhead{display:flex;align-items:center;gap:12px}
.jico{flex:none;width:52px;height:52px;border-radius:50%;display:grid;place-items:center;background:radial-gradient(circle at 35% 30%,var(--card) 0 10%,var(--petal) 70%);color:var(--berry-ink)}
.jico svg{width:26px;height:26px}
.jcard h3{font-size:1.45rem}
.jcard p{margin:0;color:var(--muted)}
.jdeco{grid-row:1;width:74px;height:74px;opacity:.85;transition:transform .9s cubic-bezier(.3,1.5,.5,1);transform:scale(.6) rotate(-30deg)}
.jstep:nth-child(odd) .jdeco{grid-column:3;justify-self:start;margin-inline-start:12%}

/* products */

/* sale + best seller */

.pricebox .off{order:1}.pricebox .was{order:2}
.pricebox .price{margin-top:0;grid-column:1/-1;order:3}

.was{color:var(--muted);font-size:1rem;text-decoration-thickness:2px;text-decoration-color:var(--rose-1);font-variant-numeric:tabular-nums}
.was span{display:none}
.off{order:1;padding:4px 10px;border-radius:99px;background:var(--rose-1);color:#fff;font-weight:700;font-size:.85rem}
.prod.featured{box-shadow:0 0 0 3px var(--berry),var(--shadow);transform:scale(1.03)}
.prod.featured:hover{transform:scale(1.03) translateY(-8px) rotate(-1deg)}

.ribbon{position:absolute;top:-14px;inset-inline-start:50%;translate:calc(var(--sx) * -50%) 0;white-space:nowrap;z-index:2;padding:7px 16px;border-radius:99px;background:linear-gradient(180deg,color-mix(in srgb,var(--berry) 80%,#fff),var(--berry));color:var(--cream);font-weight:700;font-size:.9rem;box-shadow:var(--shadow),inset 0 2px 0 rgba(255,255,255,.3)}

/* real photos */

/* pop-out: the photo lifts out of its frame on hover, focus or tap */
.photo,.show-art{isolation:isolate}
.photo::before,.show-art::before{content:"";position:absolute;inset:0;border-radius:inherit;background:var(--petal-2);border:2px dashed var(--rose-2)}
.photo img,.show-art img{position:relative;z-index:1;border-radius:inherit;box-shadow:0 0 0 0 rgba(94,26,48,0);transition:transform .55s cubic-bezier(.3,1.5,.5,1),box-shadow .45s ease}
.show-art img{position:absolute}
.prod:hover .photo img,.prod:focus-within .photo img,.prod.pop .photo img{transform:translate3d(0,-20px,0) scale(1.12) rotate(-2.5deg);box-shadow:0 34px 40px -18px rgba(94,26,48,.55)}
.prod:hover .show-art img,.prod:focus-within .show-art img,.prod.pop .show-art img{transform:translate3d(0,-24px,0) scale(1.07) rotate(-1.5deg);box-shadow:0 44px 56px -24px rgba(94,26,48,.6)}

}

/* featured box showcase */
.showcase{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:clamp(20px,4vw,48px);align-items:center;margin-top:52px;padding:clamp(18px,3vw,32px);border-radius:52px;background:linear-gradient(140deg,var(--card) 30%,var(--petal-2))}

.sized .show-art img{scale:var(--sz,1);transition:transform .55s cubic-bezier(.3,1.5,.5,1),box-shadow .45s ease,scale .6s cubic-bezier(.3,1.7,.45,1)}
.sized .show-art.bump::before{animation:framepulse .9s ease-out}
.size-badge{position:absolute;z-index:2;top:14px;inset-inline-start:14px;padding:6px 14px;border-radius:99px;background:var(--berry);color:var(--cream);font-weight:700;font-size:.95rem;box-shadow:var(--shadow);transition:transform .4s cubic-bezier(.3,1.7,.45,1)}
.show-art.bump .size-badge{animation:badgepop .5s cubic-bezier(.3,1.7,.45,1)}
@keyframes badgepop{40%{transform:scale(1.3) rotate(-6deg)}}
.size-label{font-weight:600;font-size:.95rem;margin-bottom:-4px}
.sizes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;max-width:440px}
.size{all:unset;box-sizing:border-box;cursor:pointer;display:grid;justify-items:center;gap:2px;padding:12px 6px 14px;border-radius:28px;background:var(--card);box-shadow:0 0 0 2px var(--line);text-align:center;transition:transform .3s cubic-bezier(.3,1.6,.5,1),box-shadow .25s,background .25s,color .25s}

/* vertical videos */
.reels-head{text-align:center;margin-top:10px}
.reels-head h3{font-size:clamp(1.6rem,3.4vw,2.2rem);color:var(--berry-ink)}

.reel{position:relative;aspect-ratio:9/16;transition:transform .45s cubic-bezier(.3,1.5,.5,1),box-shadow .35s;border-radius:34px;overflow:hidden;background:var(--berry-ink);box-shadow:0 0 0 6px var(--card),0 30px 50px -24px rgba(94,26,48,.6);text-decoration:none;color:#fff;display:block;transition:transform .45s cubic-bezier(.3,1.5,.5,1)}

.reel::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(40,10,22,.35) 0%,transparent 28%,transparent 55%,rgba(40,10,22,.75) 100%);pointer-events:none}

a.rsrc{text-decoration:none}

.reel.dim{transform:scale(.96)}
.reel.dim:nth-child(2){transform:translateY(-26px) scale(.96)}
.reels{position:relative}
.reel{z-index:1}
.reel-glow{position:absolute;left:0;top:0;z-index:0;pointer-events:none;opacity:0;transition:transform 1.1s cubic-bezier(.65,0,.35,1),opacity .8s ease}
.reel-glow.on{opacity:1}
.reel-glow::before{content:"";position:absolute;inset:-70px -64px;border-radius:50%;background:radial-gradient(closest-side,var(--rose-1) 0%,color-mix(in srgb,var(--rose-1) 70%,transparent) 55%,color-mix(in srgb,var(--rose-2) 35%,transparent) 75%,transparent);filter:blur(30px)}

}
.reel{transition:transform .9s cubic-bezier(.3,1.2,.5,1),box-shadow .9s ease}

const reelsEl=document.getElementById("reels");
/* play the videos one after another (1 -> 2 -> 3 -> 1 ...) while the section is on screen;
   hovering a video on desktop plays just that one, leaving resumes the sequence */
let reelIO=null, reelHover=null, reelOn=false, reelCur=0, reelGlowAt=null, reelWait=null, reelByUser=false, reelAutoScroll=0;
const GLIDE=1100;
function reelBoxes(){return [...reelsEl.querySelectorAll(".reel")];}
function placeGlow(box,instant){
  const g=reelsEl.querySelector(".reel-glow"); if(!g||!box) return;
  if(instant){g.style.transition="none";}
  g.style.width=box.offsetWidth+"px"; g.style.height=box.offsetHeight+"px";
  const lift=parseFloat(getComputedStyle(box).getPropertyValue('--lift'))||0;
  g.style.transform=`translate(${box.offsetLeft}px,${box.offsetTop+lift}px)`;
  if(instant){void g.offsetWidth; g.style.transition="";}
}
function syncReels(){
  const boxes=reelBoxes(), active=reelHover||boxes[reelCur], g=reelsEl.querySelector(".reel-glow");
  g&&g.classList.toggle("on",reelOn&&!reduce);
  const moved=active!==reelGlowAt, first=reelGlowAt===null;
  if(reelOn&&moved){ placeGlow(active,first||reduce); reelGlowAt=active; }
  clearTimeout(reelWait);
  boxes.forEach(box=>{
    const v=box.querySelector("video"), isActive=box===active;
    box.classList.toggle("live",reelOn&&isActive); box.classList.toggle("dim",reelOn&&!isActive);
    if(!(reelOn&&isActive&&!reduce)&&!v.paused) v.pause();
  });
  if(reelOn&&!reduce){
    const v=active.querySelector("video"), go=()=>{ if(v.paused) v.play().catch(()=>{}); };
    if(moved&&!first&&!reelByUser) reelWait=setTimeout(go,GLIDE*.85); else go();
  }
  if(!reelOn) reelGlowAt=null;
}
function nextReel(){ const n=reelBoxes().length; reelCur=(reelCur+1)%n; const v=reelBoxes()[reelCur].querySelector("video"); v.currentTime=0; syncReels(); }
addEventListener("resize",()=>{ if(reelGlowAt) placeGlow(reelGlowAt,true); });
function renderReels(){
  const t=T[lang];
  reelsEl.innerHTML=REELS.map((r,i)=>`<div class="reel${r.tt?" tt":""}">
      <video poster="${r.poster}" muted playsinline preload="auto" aria-label="${t[r.cap]}"><source src="${r.src.replace(".mp4",".webm")}" type="video/webm"><source src="${r.src}" type="video/mp4"></video>
      <span class="rnum">${i+1}</span>
      <a class="rsrc" href="${r.tt?TT:IG}" target="_blank" rel="noopener">${r.tt?TT_ICON+t.watch_tt:IG_ICON+t.watch_ig}</a>
      <span class="rcap">${t[r.cap]}</span><span class="rbar"><i></i></span></div>`).join("")+'<span class="reel-glow" aria-hidden="true"></span>';
  reelGlowAt=null;
  if(reelIO) reelIO.disconnect();
  reelHover=null;
  reelBoxes().forEach((box,i)=>{
    const v=box.querySelector("video"), bar=box.querySelector(".rbar i");
    v.addEventListener("ended",()=>{ if(reelHover===box||lite){v.currentTime=0;v.play().catch(()=>{});} else if(i===reelCur) nextReel(); });
    v.addEventListener("timeupdate",()=>{ if(v.duration) bar.style.transform=`scaleX(${v.currentTime/v.duration})`; });
    if(!lite){
      box.addEventListener("pointerenter",()=>{reelHover=box;syncReels();});
      box.addEventListener("pointerleave",()=>{ if(reelHover===box){reelHover=null; reelCur=i; syncReels();} });
    }
  });
  reelIO=new IntersectionObserver(es=>{reelOn=es[0].isIntersecting; syncReels();},{threshold:.35});
  // phones: swipe between the videos - whichever one ends up in the middle starts playing
  if(lite){
    reelBoxes().forEach((box,i)=>box.addEventListener("click",e=>{ if(e.target.closest("a")) return;
      reelsEl.scrollTo({left:box.offsetLeft-(reelsEl.clientWidth-box.offsetWidth)/2,behavior:reduce?"auto":"smooth"}); }));
  }
  reelIO.observe(reelsEl);
}
renderReels();
if(lite){
  let swipeT=null;
  reelsEl.addEventListener("scroll",()=>{
    clearTimeout(swipeT);
    swipeT=setTimeout(()=>{
      if(performance.now()<reelAutoScroll) return;
      const mid=reelsEl.getBoundingClientRect().left+reelsEl.clientWidth/2;
      let best=0,bd=1e9; reelBoxes().forEach((b,i)=>{const r=b.getBoundingClientRect(),d=Math.abs(r.left+r.width/2-mid); if(d<bd){bd=d;best=i;}});
      if(best!==reelCur){ reelCur=best; const v=reelBoxes()[best].querySelector("video"); v.currentTime=0; reelByUser=true; syncReels(); reelByUser=false; }
    },110);
  },{passive:true});
}

let curCat="all";
const wasOf=p=>Math.round(p/0.85/10)*10;

const minPrice=p=>p.sizes?Math.min(...p.sizes.map(s=>s[2])):p.price;
function priceOf(p,size){return p.sizes?p.sizes.find(s=>s[0]===size)[2]:p.price;}
function fillMax(p,size){return p.fillBySize?p.fillBySize[size]:(p.fill||0);}
function fillLine(n){const t=T[lang]; return n?t.fill_msg.replace("{n}",n).replace("{w}",n===1?t.fill_one:t.fill_many):t.fill_msg_none;}
function fillPicker(max,cur){
  const t=T[lang]; if(!max) return "";

  return `<div class="fill"><span class="size-label">${t.fill_label}</span>
    <div class="fill-opts" role="radiogroup" aria-label="${t.fill_label}">${opts.map(n=>`<button type="button" class="fopt" role="radio" aria-checked="${n===cur}" data-fill="${n}">${n?`<b>${n}</b><small>${n===1?t.fill_one:t.fill_many}</small>`:`<b>${t.fill_none}</b><small>${t.fill_none_s}</small>`}</button>`).join("")}</div>
    <p class="fill-hint">${t.fill_hint.replace("{n}",max).replace("{w}",max===1?t.fill_one:t.fill_many)}</p></div>`;
}
function orderText(p,size,q,fill){
  const t=T[lang], price=priceOf(p,size); let name=t[p.id+"_t"];
  if(p.sizes){const s=p.sizes.find(x=>x[0]===size); name+=`, ${t.size_word} ${s[0]} (${s[1]} ${t.cm})`;}
  const line=price?`• ${name} × ${q} — ${price} ₪${q>1?` (${t.msg_total} ${price*q} ₪)`:""}`:`• ${name} × ${q} (${t.msg_size})`;
  const fl=fillMax(p,size)?`\n${fillLine(fill||0)}`:"";
  return "https://wa.me/972545311217?text="+encodeURIComponent(`${t.msg_hi}\n\n${line}${fl}${cardLine()}\n\n${t.msg_end}`);
}
function tagText(p){const t=T[lang];return p.tag==="best"?"★ "+t.best:p.tag==="big"?t.p6_k:p.sizes?"S · M · L":"";}

  qvPanel.querySelector(".minus").onclick=()=>{qvState.q=Math.max(1,q-1);renderQV();bump(".price");};

  qvPanel.querySelectorAll(".fopt").forEach(b=>b.onclick=()=>{qvState.fill=+b.dataset.fill;renderQV();});
  qvPanel.querySelectorAll(".size").forEach(b=>b.onclick=()=>{qvState.size=b.dataset.size;qvState.fill=Math.min(qvState.fill,fillMax(p,b.dataset.size));renderQV();bump(".price");bump(".qv-art","bump");});
  qvPanel.querySelectorAll("[data-close]").forEach(b=>b.onclick=closeQV);
  bindCard(qvPanel,()=>{qvPanel.querySelector(".order").href=orderText(p,size,qvState.q,qvState.fill);});
}

function showShot(){const t=T[lang]; shotBox.querySelector("img").src=REVIEWS[shotI].img; shotBox.querySelector("img").alt=t.rev_alt; shotBox.querySelector(".rs-n").textContent=`${shotI+1} / ${REVIEWS.length}`;}
function openShot(i,opener){shotI=i; shotOpener=opener; showShot(); shotBox.hidden=false; document.documentElement.classList.add("qv-lock"); requestAnimationFrame(()=>shotBox.classList.add("open")); shotBox.querySelector(".rs-x").focus();}
function closeShot(){shotBox.classList.remove("open"); document.documentElement.classList.remove("qv-lock"); setTimeout(()=>shotBox.hidden=true,250); if(shotOpener) shotOpener.focus({preventScroll:true});}

/* review strip moves to the next screenshot by itself every 1.5s (pauses while touched, hovered or off screen) */
(function(){
  const w=document.getElementById("revWall"), sec=document.getElementById("reviews");
  let vis=false, hold=false, timer=null, resume=null;
  function step(){
    if(!vis||hold||!shotBox.hidden||document.hidden) return;
    const cards=[...w.children]; if(cards.length<2) return;
    const rtl=document.documentElement.dir==="rtl", wr=w.getBoundingClientRect();
    const mid=wr.left+wr.width/2;
    let cur=0, best=1e9; cards.forEach((c,i)=>{const r=c.getBoundingClientRect(), d=Math.abs(r.left+r.width/2-mid); if(d<best){best=d;cur=i;}});
    const max=Math.abs(w.scrollWidth-w.clientWidth), atEnd=Math.abs(Math.abs(w.scrollLeft)-max)<4;
    if(atEnd||cur===cards.length-1){ w.scrollTo({left:0,behavior:"smooth"}); return; }
    const next=cards[cur+1].getBoundingClientRect();
    w.scrollBy({left:next.left+next.width/2-mid,behavior:"smooth"});
  }
  function start(){ if(!timer&&!reduce) timer=setInterval(step,1500); }
  function pause(ms){ hold=true; clearTimeout(resume); resume=setTimeout(()=>{hold=false;},ms||4000); }
  new IntersectionObserver(es=>{vis=es[0].isIntersecting;},{threshold:.3}).observe(sec);
  w.addEventListener("pointerdown",()=>pause(5000)); w.addEventListener("touchstart",()=>pause(5000),{passive:true});
  w.addEventListener("wheel",()=>pause(5000),{passive:true});
  w.addEventListener("mouseenter",()=>{hold=true;clearTimeout(resume);}); w.addEventListener("mouseleave",()=>pause(800));
  w.addEventListener("focusin",()=>{hold=true;clearTimeout(resume);}); w.addEventListener("focusout",()=>pause(800));
  ["revPrev","revNext"].forEach(id=>document.getElementById(id).addEventListener("click",()=>pause(5000)));
  start();
})();

/* ---- one smooth loop for story, ornaments and petals ---- */
const journey=document.getElementById("journey"), trail=document.getElementById("trail");
const tBg=document.getElementById("trailBg"), tFg=document.getElementById("trailFg"), tHi=document.getElementById("trailHi"), rider=document.getElementById("rider");
const orns=[...document.querySelectorAll(".orn")];
let journeyTop=0, vh=innerHeight, trailLen=0, lastL=-1, LUT=[];
function absTop(el){let y=0;while(el){y+=el.offsetTop;el=el.offsetParent;}return y;}
function buildTrail(){
  const jr=journey.getBoundingClientRect(); if(!jr.width) return;
  const rel=(el,ay)=>{const r=el.getBoundingClientRect();return{x:r.left+r.width/2-jr.left,y:r.top+r.height*ay-jr.top};};
  const narrow=innerWidth<=760;
  const pts=[rel(document.querySelector("#jStart svg"),.75)];
  jsteps.querySelectorAll(".jnode").forEach(n=>pts.push(rel(n,.5)));
  pts.push(rel(document.querySelector("#jEnd svg"),.45));
  const bulge=narrow?22:110;
  let d=`M${pts[0].x.toFixed(1)} ${pts[0].y.toFixed(1)}`;
  for(let k=1;k<pts.length;k++){const a=pts[k-1],b=pts[k],dy=b.y-a.y,sg=k%2?1:-1;
    const bx=narrow&&(k===1||k===pts.length-1)?0:sg*bulge;
    d+=` C${(a.x+bx).toFixed(1)} ${(a.y+dy*.45).toFixed(1)} ${(b.x+bx).toFixed(1)} ${(b.y-dy*.45).toFixed(1)} ${b.x.toFixed(1)} ${b.y.toFixed(1)}`;}
  trail.setAttribute("width",jr.width); trail.setAttribute("height",jr.height);
  trail.setAttribute("viewBox",`0 0 ${jr.width} ${jr.height}`);
  [tBg,tFg,tHi].forEach(pth=>pth.setAttribute("d",d));
  trailLen=tFg.getTotalLength();
  [tFg,tHi].forEach(pth=>{pth.style.strokeDasharray=trailLen;pth.style.strokeDashoffset=reduce?0:trailLen;});
  LUT=[]; const N=240;
  for(let i=0;i<=N;i++){const L=trailLen*i/N,pt=tFg.getPointAtLength(L);LUT.push([L,pt.x,pt.y]);}
  lastL=-1;
}
function measure(){
  vh=innerHeight;
  buildTrail();
  journeyTop=absTop(journey);
  orns.forEach(o=>{o._top=absTop(o)+o.offsetHeight/2;o._sp=parseFloat(o.dataset.speed||0);o._y=null;});
}
addEventListener("resize",measure);
addEventListener("load",measure);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(measure);

/* falling petals */
const pc=document.getElementById("petals"), pctx=pc.getContext("2d");
let pw=0,ph=0,dpr=Math.min(devicePixelRatio||1,1.5);
const PCOL=["#f4a9bb","#e8829e","#fbe3c9","#c9b2e6","#fff0f3"];
const petals=Array.from({length:22},()=>newPetal(true));
function newPetal(init){return{x:Math.random(),y:init?Math.random():-0.05,s:6+Math.random()*9,r:Math.random()*6.28,vr:(Math.random()-.5)*.03,vy:.0006+Math.random()*.0009,sw:Math.random()*6.28,c:PCOL[(Math.random()*PCOL.length)|0]};}
function sizePetals(){pw=innerWidth;ph=innerHeight;pc.width=pw*dpr;pc.height=ph*dpr;pctx.setTransform(dpr,0,0,dpr,0,0);}
sizePetals(); addEventListener("resize",sizePetals);

let lastY=scrollY, vel=0;
function frame(){
  const y=scrollY;
  vel+= ((y-lastY)-vel)*.15; lastY=y;

  // piping trail: draw the ribbon down to 60% of the screen
  if(!reduce){
    if(LUT.length){
      const ty=y+vh*.6-journeyTop;
      let lo=0,hi=LUT.length-1;
      if(ty<=LUT[0][2]) hi=0; else if(ty>=LUT[hi][2]) lo=hi;
      else{while(hi-lo>1){const m=(lo+hi)>>1; if(LUT[m][2]<ty) lo=m; else hi=m;}}
      const A=LUT[lo],B=LUT[hi],f=B[2]>A[2]?(ty-A[2])/(B[2]-A[2]):0, fc=Math.max(0,Math.min(1,f));
      const L=A[0]+(B[0]-A[0])*fc;
      if(Math.abs(L-lastL)>.5){
        const off=(trailLen-L).toFixed(1);
        tFg.style.strokeDashoffset=off; tHi.style.strokeDashoffset=off;
        const x=A[1]+(B[1]-A[1])*fc, yy=A[2]+(B[2]-A[2])*fc;
        rider.style.transform=`translate3d(${x.toFixed(1)}px,${yy.toFixed(1)}px,0) rotate(${(L*.4).toFixed(0)}deg)`;
        lastL=L;
      }
    }

    // ornament parallax
    const mid=y+vh/2;
    if(!lite) for(const o of orns){
      if(Math.abs(o._top-mid)>vh*1.2) continue;
      const ty=((o._top-mid)*o._sp).toFixed(1);
      if(ty!==o._y){o.style.transform=`translate3d(0,${ty}px,0) rotate(${(ty*.15).toFixed(1)}deg)`;o._y=ty;}
    }

    // petals
    if(!lite){ pctx.clearRect(0,0,pw,ph);
    for(const p of petals){
      p.y+=p.vy+vel*-.00004; p.sw+=.02; p.r+=p.vr+vel*.0008;
      if(p.y>1.05) Object.assign(p,newPetal(false));
      if(p.y<-0.08) p.y=1.04;
      const px=(p.x+Math.sin(p.sw)*.015)*pw, py=p.y*ph;
      pctx.save(); pctx.translate(px,py); pctx.rotate(p.r); pctx.scale(1,.55+.45*Math.sin(p.sw*1.3));
      pctx.globalAlpha=.75; pctx.fillStyle=p.c;
      pctx.beginPath(); pctx.moveTo(0,-p.s); pctx.bezierCurveTo(p.s*.9,-p.s*.6,p.s*.7,p.s*.7,0,p.s); pctx.bezierCurveTo(-p.s*.7,p.s*.7,-p.s*.9,-p.s*.6,0,-p.s); pctx.fill();
      pctx.globalAlpha=.5; pctx.fillStyle="#fff"; pctx.beginPath(); pctx.ellipse(-p.s*.2,-p.s*.3,p.s*.18,p.s*.32,0,0,6.28); pctx.fill();
      pctx.restore();
    }}
  }
  if(!lite) requestAnimationFrame(frame); else ticking=false;
}
function kick(){if(lite&&!ticking){ticking=true;requestAnimationFrame(frame);}}
addEventListener("scroll",kick,{passive:true});
addEventListener("resize",kick);
setLang(lang);
requestAnimationFrame(frame);

/* ---- real photos with depth (2.5D): hero bouquet + featured box ---- */
(function(){
  let tx=0,ty=0;
  addEventListener("pointermove",e=>{tx=(e.clientX/innerWidth-.5)*2;ty=(e.clientY/innerHeight-.5)*2;},{passive:true});

      renderer.setPixelRatio(lite?1:Math.min(devicePixelRatio,2));
      const scene=new THREE.Scene(), cam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);
      const tex=new THREE.Texture(it.img); tex.needsUpdate=true; tex.minFilter=THREE.LinearFilter; tex.generateMipmaps=false;
      const dImg=new Image(), dtex=new THREE.Texture(dImg); dImg.onload=()=>{dtex.needsUpdate=true;}; dImg.src=it.depth;
      const mat=new THREE.ShaderMaterial({transparent:true,
        uniforms:{uTex:{value:tex},uDepth:{value:dtex},uM:{value:new THREE.Vector2()},uZoom:{value:it.zoom},uS:{value:it.strength}},
        vertexShader:"varying vec2 vUv;void main(){vUv=uv;gl_Position=vec4(position.xy,0.,1.);}",
        fragmentShader:"precision highp float;uniform sampler2D uTex,uDepth;uniform vec2 uM;uniform float uZoom,uS;varying vec2 vUv;"+
          "void main(){vec2 c=(vUv-.5)/uZoom+.5;float d=texture2D(uDepth,c).r;vec2 uv=c+uM*(d-.42)*uS;"+
          "vec4 col=texture2D(uTex,uv);if(uv.x<0.||uv.x>1.||uv.y<0.||uv.y>1.)col=vec4(0.);gl_FragColor=col;}"});
      scene.add(new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat));
      const size=()=>{const r=it.art.getBoundingClientRect();renderer.setSize(r.width,r.height,false);};
      addEventListener("resize",size); size();
      it.gl={renderer,scene,cam,mat}; it.art.classList.add("gl");
    }catch(e){it.gl=null;}
  }
  function add(o){
    if(!o.art) return;
    const it=Object.assign({mx:0,my:0,lx:0,ly:0,over:false,visible:true,gl:null,ph:items.length*1.7},o);
    new IntersectionObserver(es=>{it.visible=es[0].isIntersecting;}).observe(o.art);
    if(o.local){
      o.art.addEventListener("pointermove",e=>{const r=o.art.getBoundingClientRect();it.lx=((e.clientX-r.left)/r.width-.5)*2;it.ly=((e.clientY-r.top)/r.height-.5)*2;it.over=true;});
      o.art.addEventListener("pointerleave",()=>{it.over=false;});
    }
    if(o.img.complete) initGL(it); else o.img.addEventListener("load",()=>initGL(it),{once:true});
    items.push(it);
  }
  add({art:document.getElementById("heroArt"),img:document.getElementById("bouquetImg"),canvas:document.getElementById("scene"),depth:DEPTH,zoom:.9,strength:.09,rot:13,hero:true});

  const t0=performance.now();
  function tick(){
    requestAnimationFrame(tick);
    const t=(performance.now()-t0)/1000;
    for(const it of items){
      if(!it.visible) continue;
      const idleX=reduce?0:Math.sin(t*.55+it.ph)*.65, idleY=reduce?0:Math.cos(t*.4+it.ph)*.45;
      let gx,gy,extra="";
      if(it.hero){
        const sp=Math.min(1,scrollY/600);
        gx=(lite?0:tx)+idleX; gy=(lite?0:ty)+idleY-sp*.8;
        extra=` translate3d(0,${(sp*40).toFixed(1)}px,0) scale(${(1-sp*.06).toFixed(3)})`;
      }else{
        const r=it.art.getBoundingClientRect(), rel=((r.top+r.height/2)-innerHeight/2)/innerHeight;
        gx=it.over?it.lx*1.2:idleX; gy=(it.over?it.ly*1.2:idleY*.6)+rel*1.2;
      }
      it.mx+=(gx-it.mx)*.06; it.my+=(gy-it.my)*.06;
      it.art.style.transform=`perspective(1100px) rotateY(${(it.mx*it.rot).toFixed(2)}deg) rotateX(${(-it.my*it.rot*.6).toFixed(2)}deg)`+extra;
      if(it.gl){it.gl.mat.uniforms.uM.value.set(it.mx,-it.my);it.gl.renderer.render(it.gl.scene,it.gl.cam);}
    }
  }
  tick();
})();
</script>

<script>
/* visit statistics (GoatCounter, no cookies) + which order buttons get clicked */
document.addEventListener("click",e=>{
  const a=e.target.closest("a"); if(!a||!window.goatcounter||!window.goatcounter.count) return;
  const h=a.getAttribute("href")||""; let ev="";
  if(h.includes("wa.me")){
    let what="general";
    if(a.id==="orderBar") what="sticky-button";
    else if(a.closest("#qvPanel")&&typeof qvState!=="undefined"&&qvState) what=qvState.id+(qvState.size?"-"+qvState.size:"");
    else if(a.closest(".showcase")) what="p5-bestseller";
    else if(a.closest("#contact")) what="contact";
    else if(a.closest("header")) what="header";
    else if(a.closest(".hero,#top")) what="hero";
    ev="order/"+what;
  } else if(h.includes("instagram.com")) ev="social/instagram";
  else if(h.includes("tiktok.com")) ev="social/tiktok";
  if(ev) window.goatcounter.count({path:ev,title:ev,event:true});
},true);
</script>
<script data-goatcounter="https://sweetflowers.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
